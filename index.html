<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Thae Thae 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dff3ff, #74c7ff, #2589d8);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #123;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.92);
      border-radius: 25px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.18);
    }

    .heart {
      font-size: 55px;
      animation: beat 1.2s infinite;
    }

    h1 {
      color: #087ac1;
      margin: 10px 0;
    }

    .message {
      font-size: 18px;
      line-height: 1.8;
      margin: 20px 0;
    }

    .music {
      margin-top: 25px;
    }

    iframe {
      width: 100%;
      height: 220px;
      border: none;
      border-radius: 15px;
    }

    .small {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">💙</div>

    <h1>For Thae Thae</h1>

    <div class="message">
      မင်းကိုတွေ့ခဲ့ရတာက<br>
      ကိုယ့်ဘဝထဲက အမှတ်တရလေးတစ်ခုမဟုတ်ဘူး။<br><br>

      ကိုယ့်အတွက် အရမ်းတန်ဖိုးရှိတဲ့<br>
      လူတစ်ယောက်ကို တွေ့ခဲ့ရတာပါ။ 💙<br><br>

      မင်းပြုံးတဲ့အချိန်တိုင်း<br>
      ကိုယ့်ရဲ့နေ့ရက်တွေ ပိုပြီးလှလာတယ်။<br><br>

      <b>Thae Thae ကို အရမ်းချစ်တယ် 💙</b>
    </div>

    <div class="music">
      <h3>🎵 Our Song</h3>

      <iframe
        src="https://www.youtube.com/embed/GRC_iiZtAkA"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>

    <div class="small">
      Made with love 💙
    </div>

  </div>

</body>
</html>
