<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Thae Thae 💙</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#dff5ff,#65bdf5,#167ac5);
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#123;
}

.container{
  width:90%;
  max-width:500px;
  text-align:center;
  background:rgba(255,255,255,0.93);
  padding:25px;
  border-radius:25px;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}

h1{
  color:#087ac1;
}

.heart{
  font-size:55px;
  animation:beat 1.2s infinite;
}

#message{
  font-size:18px;
  line-height:1.8;
  margin:20px 0;
}

button{
  border:0;
  background:#087ac1;
  color:white;
  padding:14px 28px;
  border-radius:30px;
  font-size:17px;
}

#content{
  display:none;
}

@keyframes beat{
  50%{transform:scale(1.15);}
}
</style>
</head>

<body>

<div class="container">

<div class="heart">💙</div>

<h1>For Thae Thae</h1>

<button onclick="startLove()">Tap to Start 💙</button>

<div id="content">

<p id="message">
မင်းကိုတွေ့ခဲ့ရတာက<br>
ကိုယ့်ဘဝထဲက အမှတ်တရလေးတစ်ခုမဟုတ်ဘူး။<br><br>

ကိုယ့်အတွက် အရမ်းတန်ဖိုးရှိတဲ့<br>
လူတစ်ယောက်ကို တွေ့ခဲ့ရတာပါ။ 💙<br><br>

မင်းပြုံးတဲ့အချိန်တိုင်း<br>
ကိုယ့်ရဲ့နေ့ရက်တွေ ပိုပြီးလှလာတယ်။<br><br>

<b>Thae Thae ကို အရမ်းချစ်တယ် 💙</b>
</p>

</div>

</div>

<script>

function startLove(){

  document.querySelector("button").style.display="none";

  document.getElementById("content").style.display="block";

}

</script>

</body>
</html>
